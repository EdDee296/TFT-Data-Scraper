# TFT Stats Configuration File
# Switch between local testing and production deployment

[database]
# SQLite database file (local)
db_file = tft.db

[api]
# Local testing: Set to False to disable remote uploads
enable_remote_upload = False

# Remote server settings (only used when enable_remote_upload = True)
remote_server = ubuntu@138.2.239.13
remote_path = ~/api/stats2.json
ssh_key = tftstats.pem

# Local API settings
local_json_file = data.json
local_backup_dir = api_backups

[processing]
# How often to generate JSON exports (every N games processed)
json_export_frequency = 5

# Regions to monitor (comment out with # to disable)
regions = NA,EUW
# regions = NA,EUW,VN,SEA

[debugging]
# Set to True for more verbose logging
debug_mode = False

# Keep local copies of uploaded data
backup_uploads = True
